<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — GPG</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='48' font-family='Arial,sans-serif' font-size='44' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #ffffff;
      font-family: "Courier New", monospace;
      line-height: 1;
    }
    .error-code span { display: inline-block; }
    .error-code .glitch {
      animation: glitch 2s infinite;
      position: relative;
    }
    .error-code .glitch::before,
    .error-code .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    .error-code .glitch::before {
      color: #ff0000;
      animation: glitch-1 0.3s infinite linear alternate-reverse;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }
    .error-code .glitch::after {
      color: #00ffff;
      animation: glitch-2 0.4s infinite linear alternate-reverse;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-2px, 1px); }
      94% { transform: translate(2px, -1px); }
      96% { transform: translate(-1px, 2px); }
      98% { transform: translate(1px, -2px); }
    }
    @keyframes glitch-1 {
      0% { transform: translate(0); }
      50% { transform: translate(2px, 0); }
      100% { transform: translate(-2px, 0); }
    }
    @keyframes glitch-2 {
      0% { transform: translate(0); }
      50% { transform: translate(-2px, 0); }
      100% { transform: translate(2px, 0); }
    }
    .error-message {
      color: #888;
      font-family: sans-serif;
      font-size: 1.1rem;
      max-width: 400px;
      line-height: 1.6;
    }
    .error-links {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .error-links a {
      color: #ffffff;
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }
    .error-links a:hover { opacity: 1; }
    .signal {
      margin-top: 40px;
      width: 120px;
      height: 40px;
      position: relative;
      overflow: hidden;
    }
    .signal::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #333, transparent);
      animation: signal-sweep 3s infinite;
    }
    .signal-bar {
      position: absolute;
      bottom: 0;
      width: 3px;
      background: #444;
      animation: bar-rise 0.8s infinite ease-in-out;
    }
    .signal-bar:nth-child(1) { left: 10%; animation-delay: 0s; height: 15%; }
    .signal-bar:nth-child(2) { left: 25%; animation-delay: 0.1s; height: 35%; }
    .signal-bar:nth-child(3) { left: 40%; animation-delay: 0.2s; height: 60%; }
    .signal-bar:nth-child(4) { left: 55%; animation-delay: 0.3s; height: 25%; }
    .signal-bar:nth-child(5) { left: 70%; animation-delay: 0.4s; height: 45%; }
    .signal-bar:nth-child(6) { left: 85%; animation-delay: 0.5s; height: 20%; }
    @keyframes signal-sweep {
      0% { transform: translateX(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    @keyframes bar-rise {
      0%, 100% { height: 10%; opacity: 0.3; }
      50% { height: 100%; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">
      <span class="glitch" data-text="4">4</span>
      <span class="glitch" data-text="0">0</span>
      <span class="glitch" data-text="4">4</span>
    </div>
    <p class="error-message">This frequency doesn't exist. The signal was lost in the noise.</p>
    <div class="error-links">
      <a href="/">← back to GPG</a>
      <a href="/giuxep">archive</a>
      <a href="/piecha">piecha</a>
    </div>
    <div class="signal" aria-hidden="true">
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
    </div>
  </div>

  <script>
    // Favicon animata: G -> P -> G
    (function () {
      const letters = ['G', 'P', 'G'];
      const favicon = document.getElementById('favicon');
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      let i = 0;

      function drawFavicon() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 64, 64);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 44px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(letters[i], 32, 36);
        favicon.type = 'image/png';
        favicon.href = canvas.toDataURL('image/png');
        i = (i + 1) % letters.length;
      }

      drawFavicon();
      setInterval(drawFavicon, 500);
    })();
  </script>
</body>
</html>
